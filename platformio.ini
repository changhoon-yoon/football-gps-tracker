; ============================================================
;  FootTrack — 축구/풋살 실시간 동선 트래커
;  ESP32-S3-WROOM-1 N16R8 + ATGM336H(GPS 10Hz) + ICM-42688-P(IMU 100Hz)
;  폰 핫스팟(STA) 또는 자체 AP로 접속 → 웹페이지가 SSE로 실시간 동선 지도 표시
; ============================================================
[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; 실제 모듈: ESP32-S3-WROOM-1 N16R8 (16MB QSPI flash + 8MB OPI PSRAM)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

monitor_speed = 115200
upload_speed  = 921600
; upload_port = COM3      ; 필요 시 고정
; monitor_port = COM3

; 모니터가 DTR/RTS로 보드를 다운로드 모드로 리셋하는 것 방지
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; CH343 UART 브리지로 시리얼 출력 (DOA 노드와 동일)
    -DCORE_DEBUG_LEVEL=1

; 웹페이지 원본(docs/app/index.html)을 빌드 전에 src/web_page.h로 임베드
extra_scripts = pre:tools/embed_page.py

lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    h2zero/NimBLE-Arduino@^1.4.3

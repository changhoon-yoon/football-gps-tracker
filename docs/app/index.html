<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>FootTrack</title>
<!--
  FootTrack 실시간 동선 페이지 — 원본은 이 파일 하나 (docs/app/index.html)
   · ESP32가 WiFi로 서빙(http://<ESP IP>/): SSE(/events)로 수신. 빌드 시 tools/embed_page.py가 펌웨어에 내장.
   · GitHub Pages(https)에서 열면: Web Bluetooth(Android Chrome)로 ESP32에 직접 BLE 연결.
   · 인터넷 있으면 Leaflet+OSM 지도, 없으면 첫 점 기준 미터 격자 캔버스로 폴백.
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee}
#map,#local{position:absolute;inset:0}
#local{display:none;background:#181c20}
#st{position:absolute;top:8px;left:8px;right:8px;z-index:1000;background:rgba(16,18,22,.88);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.4}
.ok{color:#5ad17a}.warn{color:#f5c542}.bad{color:#ff7b72}
#hud{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:rgba(16,18,22,.93);border-top:1px solid #333;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.tile{background:#22262b;border-radius:8px;padding:6px 7px;min-width:0;overflow:hidden}
.tile .l{font-size:11px;color:#9aa}
.tile .v{font-size:17px;font-weight:600;line-height:1.3;white-space:nowrap}
.tile .u{font-size:10px;color:#9aa;margin-left:1px}
#zones{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:9px 0 3px;background:#2a2e33}
#zones div{height:100%;transition:width .3s}
.zl{display:flex;justify-content:space-between;font-size:10px;color:#9aa}
.row{display:flex;gap:5px;margin-top:9px}
button,a.btn{flex:1 1 0;min-width:0;padding:9px 0;border:0;border-radius:8px;background:#2f6feb;color:#fff;font-size:12.5px;text-align:center;text-decoration:none;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{background:#3a3f46!important}
#ble{background:#7c3aed}
#ble.on{background:#1f9d55}
[hidden]{display:none!important}
/* GPS 상세 패널 */
#st{cursor:pointer}
#st .tg{float:right;color:#9aa;font-weight:600;margin-left:8px}
#gp{position:absolute;top:46px;left:8px;right:8px;z-index:1000;background:rgba(16,18,22,.95);border-radius:8px;padding:8px 10px;font-size:12px;max-height:50vh;overflow:auto;display:none}
#gp.open{display:block}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;align-items:baseline}
.kv b{color:#9aa;font-weight:500;font-size:11px}
.kv span{font-family:ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nmea{font:10.5px/1.3 ui-monospace,Consolas,monospace;color:#8fd3a0;word-break:break-all;margin-top:6px}
#feed{font:11px/1.35 ui-monospace,Consolas,monospace;white-space:pre;margin:6px 0 0;color:#cfd8dc;height:22vh;overflow:auto;background:#0d1013;border-radius:6px;padding:6px}
.gpb{display:flex;gap:6px;margin-top:8px}
.gpb button,.gpb a.btn{padding:6px 2px;font-size:12px}
</style></head><body>
<div id="map"></div><canvas id="local"></canvas>
<div id="st">연결 중…</div>
<div id="gp">
 <div class="kv">
  <b>위도</b><span id="g_lat">-</span><b>경도</b><span id="g_lon">-</span>
  <b>고도</b><span id="g_alt">-</span><b>속도</b><span id="g_spd">-</span>
  <b>방향</b><span id="g_crs">-</span><b>위성</b><span id="g_sat">-</span>
  <b>HDOP</b><span id="g_hdop">-</span><b>UTC</b><span id="g_utc">-</span>
  <b>수신</b><span id="g_hz">-</span><b>경로</b><span id="g_src">-</span>
 </div>
 <div id="nmea"></div>
 <pre id="feed"></pre>
 <div class="gpb"><button class="sec" id="g_copy">좌표 복사</button><a class="btn sec" id="g_map" href="#" target="_blank" rel="noopener">지도앱</a><button class="sec" id="g_clear">피드 지우기</button></div>
</div>
<div id="hud">
 <div class="tiles">
  <div class="tile"><div class="l">이동거리</div><div class="v"><span id="dist">0</span><span class="u" id="du">m</span></div></div>
  <div class="tile"><div class="l">현재속도</div><div class="v"><span id="spd">0.0</span><span class="u">km/h</span></div></div>
  <div class="tile"><div class="l">최고속도</div><div class="v"><span id="max">0.0</span><span class="u">km/h</span></div></div>
  <div class="tile"><div class="l">경과</div><div class="v"><span id="el">00:00</span></div></div>
 </div>
 <div id="zones"><div id="z0" style="background:#4b5563"></div><div id="z1" style="background:#22c55e"></div><div id="z2" style="background:#eab308"></div><div id="z3" style="background:#f97316"></div><div id="z4" style="background:#ef4444"></div></div>
 <div class="zl"><span>걷기</span><span>조깅</span><span>러닝</span><span>고속</span><span>스프린트 <b id="spr">0</b>회</span></div>
 <div class="row">
  <button id="ble" hidden>BLE 연결</button>
  <button class="sec" id="follow">따라가기 ON</button>
  <button id="reset">리셋</button>
  <a class="btn sec" id="gpx" href="/track.gpx" download="foottrack.gpx">GPX</a>
 </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const hasL=!!window.L;
const viaHttp=location.protocol==='http:';            // ESP32가 서빙 → SSE 사용 가능
const hasBle=!!(navigator.bluetooth);                  // Android Chrome 등 Web Bluetooth
let pts=[],map=null,line=null,marker=null,follow=true,centered=false,last=null,dropped=false,es=null;
let stats={max:0,el:0,z:[0,0,0,0,0],spr:0,pl:0,n:0,alt:null};   // BLE STATS(1Hz) 보관 → FIX(10Hz)와 합쳐 update()
const pad=n=>(n<10?'0':'')+n;
const fmtEl=s=>pad(Math.floor(s/60))+':'+pad(s%60);

/* ---- Leaflet 지도 (인터넷 되는 경우) ---- */
function initMap(){
  if(!hasL){$('map').style.display='none';$('local').style.display='block';return;}
  map=L.map('map',{zoomControl:false}).setView([37.5665,126.978],16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  line=L.polyline([],{color:'#2f6feb',weight:4,opacity:.9}).addTo(map);
  marker=L.circleMarker([0,0],{radius:7,color:'#fff',weight:2,fillColor:'#ef4444',fillOpacity:1}).addTo(map);
  map.on('dragstart',()=>setFollow(false));
}
function setFollow(f){follow=f;$('follow').textContent='따라가기 '+(f?'ON':'OFF');if(f&&last&&hasL)map.panTo(last,{animate:false});}

/* ---- 오프라인 캔버스 (첫 점 기준 미터 좌표, 10/20/50m 격자) ---- */
const cv=$('local'),cx=cv.getContext('2d');let origin=null;
function toXY(p){if(!origin)origin=p;const R=6371000,d=Math.PI/180;return[(p[1]-origin[1])*d*R*Math.cos(origin[0]*d),(p[0]-origin[0])*d*R];}
function drawLocal(cur){
  if(hasL)return;
  const dpr=devicePixelRatio||1,W=cv.width=cv.clientWidth*dpr,H=cv.height=cv.clientHeight*dpr,hud=$('hud').offsetHeight*dpr;
  cx.fillStyle='#181c20';cx.fillRect(0,0,W,H);
  const xy=pts.map(toXY);if(cur)xy.push(toXY(cur));
  if(!xy.length){cx.fillStyle='#9aa';cx.font=(14*dpr)+'px system-ui';cx.fillText('오프라인 모드 · GPS fix 대기 중',16*dpr,60*dpr);return;}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of xy){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
  const span=Math.max(x1-x0,y1-y0,20),s=Math.min(W-40*dpr,H-hud-70*dpr)/span;
  const P=p=>[W/2+(p[0]-(x0+x1)/2)*s,(H-hud)/2-(p[1]-(y0+y1)/2)*s];
  const g=span>300?50:span>100?20:10;cx.strokeStyle='#262b31';cx.lineWidth=dpr;
  for(let x=Math.floor(x0/g)*g;x<=x1+g;x+=g){const[X]=P([x,0]);cx.beginPath();cx.moveTo(X,0);cx.lineTo(X,H);cx.stroke();}
  for(let y=Math.floor(y0/g)*g;y<=y1+g;y+=g){const[,Y]=P([0,y]);cx.beginPath();cx.moveTo(0,Y);cx.lineTo(W,Y);cx.stroke();}
  cx.strokeStyle='#2f6feb';cx.lineWidth=3*dpr;cx.lineJoin='round';cx.lineCap='round';cx.beginPath();
  for(let i=0;i<pts.length;i++){const[X,Y]=P(xy[i]);i?cx.lineTo(X,Y):cx.moveTo(X,Y);}cx.stroke();
  if(cur){const[X,Y]=P(xy[xy.length-1]);cx.fillStyle='#ef4444';cx.beginPath();cx.arc(X,Y,7*dpr,0,7);cx.fill();}
  cx.fillStyle='#9aa';cx.font=(12*dpr)+'px system-ui';cx.fillText('오프라인 · 격자 '+g+'m · 범위 '+Math.round(span)+'m',12*dpr,58*dpr);
}

/* ---- 공통 그리기 ---- */
function addPt(p){pts.push(p);if(hasL)line.addLatLng(p);}
function setPts(arr){pts=arr;origin=null;
  if(hasL){line.setLatLngs(arr);if(arr.length){map.fitBounds(line.getBounds(),{padding:[40,40],maxZoom:18});centered=true;}}
  else drawLocal(null);}
function update(d){
  const km=d.dist>=1000;$('dist').textContent=km?(d.dist/1000).toFixed(2):Math.round(d.dist);$('du').textContent=km?'km':'m';
  $('spd').textContent=d.spd.toFixed(1);$('max').textContent=d.max.toFixed(1);$('el').textContent=fmtEl(d.el);$('spr').textContent=d.spr;
  const zt=d.z.reduce((a,b)=>a+b,0)||1;d.z.forEach((v,i)=>$('z'+i).style.width=(v/zt*100)+'%');
  let s=(bleOn?'<b class="ok">BLE</b> ':'');
  if(!d.gps)s+='<b class="bad">● GPS 무응답</b> 배선 확인';
  else if(d.fix)s+='<b class="ok">● FIX</b> · 위성 '+d.sat+' · HDOP '+d.hdop.toFixed(1)+' · 점 '+d.n;
  else s+='<b class="warn">● 위성 탐색 중</b> · 보이는 위성 '+(d.siv||0)+'개'+((d.siv||0)<4?' · 하늘이 보이는 실외로 (첫 fix 1~2분)':' · 곧 잡힘');
  if(d.imu)s+=' · PL '+d.pl.toFixed(0);
  s+='<span class="tg">GPS '+(gpOpen?'▴':'▾')+'</span>';
  $('st').innerHTML=s;
  gpsPanel(d);
  if(d.fix){const p=[d.lat,d.lon];last=p;if(d.pt)addPt(p);
    if(hasL){marker.setLatLng(p);if(!centered){map.setView(p,17);centered=true;}else if(follow)map.panTo(p,{animate:false});}
    else drawLocal(p);}
}

/* ---- GPS 상세 패널 (상태줄을 탭하면 열림): 좌표 10Hz 피드, 수신율, 원시 NMEA ---- */
let gpOpen=false,rx=[],feedN=0;
const fmtT=()=>{const t=new Date();return pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds())+'.'+Math.floor(t.getMilliseconds()/100);};
function gpsPanel(d){
  const now=performance.now();rx.push(now);while(rx.length&&now-rx[0]>2000)rx.shift();
  const fix=!!d.fix;
  $('g_lat').textContent=fix?d.lat.toFixed(7):'-';$('g_lon').textContent=fix?d.lon.toFixed(7):'-';
  $('g_alt').textContent=fix&&d.alt!=null?d.alt.toFixed(1)+' m':'-';
  $('g_spd').textContent=fix?d.spd.toFixed(1)+' km/h':'-';$('g_crs').textContent=fix?Math.round(d.crs)+'°':'-';
  $('g_sat').textContent=d.sat+' 사용 / '+(d.siv||0)+' 보임';$('g_hdop').textContent=d.hdop.toFixed(1);
  $('g_utc').textContent=d.utc||'-';$('g_hz').textContent=(rx.length/2).toFixed(1)+' Hz';$('g_src').textContent=bleOn?'BLE':'WiFi SSE';
  if(d.nmea)$('nmea').textContent=d.nmea;
  const line=(d.utc||fmtT())+(fix?'  '+d.lat.toFixed(7)+'  '+d.lon.toFixed(7)+'  '+d.spd.toFixed(1).padStart(5)+'km/h  '+String(Math.round(d.crs)).padStart(3)+'°'
                              :'  fix 없음 · 보이는 위성 '+(d.siv||0));
  const f=$('feed');f.textContent+=(feedN++?'\n':'')+line;
  if(feedN>60){f.textContent=f.textContent.split('\n').slice(-60).join('\n');feedN=60;}
  if(gpOpen)f.scrollTop=f.scrollHeight;
}
$('st').onclick=()=>{gpOpen=!gpOpen;$('gp').classList.toggle('open',gpOpen);if(gpOpen){const f=$('feed');f.scrollTop=f.scrollHeight;}};
$('g_clear').onclick=()=>{$('feed').textContent='';feedN=0;};
$('g_copy').onclick=()=>{if(!last)return;const t=last[0].toFixed(7)+','+last[1].toFixed(7);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('g_copy').textContent='복사됨';setTimeout(()=>$('g_copy').textContent='좌표 복사',1200);}).catch(()=>prompt('좌표',t));};
$('g_map').onclick=e=>{if(!last){e.preventDefault();return;}const q=last[0].toFixed(7)+','+last[1].toFixed(7);
  e.currentTarget.href=/Android/i.test(navigator.userAgent)?'geo:'+q+'?q='+q:'https://www.google.com/maps?q='+q;};

/* ---- WiFi 경로: SSE ---- */
function loadTrack(){return fetch('/track',{cache:'no-store'}).then(r=>r.json()).then(j=>setPts(j.pts.map(p=>[p[0],p[1]])));}
function connectSse(){
  es=new EventSource('/events');
  es.addEventListener('fix',e=>{if(!bleOn)update(JSON.parse(e.data));});
  es.onopen=()=>{if(dropped){dropped=false;loadTrack().catch(()=>{});}};
  es.onerror=()=>{dropped=true;if(!bleOn)$('st').innerHTML='<b class="bad">● 연결 끊김</b> 재접속 중…';};
}

/* ---- BLE 경로: Web Bluetooth (규격은 src/ble_link.h) ---- */
const U={svc:'f007ba11-0000-4c45-8000-000000000000',fix:'f007ba11-0001-4c45-8000-000000000000',stats:'f007ba11-0002-4c45-8000-000000000000',hist:'f007ba11-0003-4c45-8000-000000000000',ctrl:'f007ba11-0004-4c45-8000-000000000000'};
let bleOn=false,bleDev=null,bleCtrl=null,histBuf=[],wake=null;
async function keepAwake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen');}catch(_){}}
async function bleConnect(){
  if(bleOn){try{bleDev.gatt.disconnect();}catch(_){}return;}
  try{
    $('ble').textContent='연결 중…';
    bleDev=await navigator.bluetooth.requestDevice({filters:[{services:[U.svc]}]});
    bleDev.addEventListener('gattserverdisconnected',()=>{bleOn=false;$('ble').textContent='BLE 재연결';$('ble').classList.remove('on');$('st').innerHTML='<b class="bad">● BLE 끊김</b> 버튼으로 재연결';});
    const gatt=await bleDev.gatt.connect();
    const svc=await gatt.getPrimaryService(U.svc);
    const [cFix,cStats,cHist,cCtrl]=await Promise.all([U.fix,U.stats,U.hist,U.ctrl].map(u=>svc.getCharacteristic(u)));
    bleCtrl=cCtrl;
    cFix.addEventListener('characteristicvaluechanged',e=>onFix(e.target.value));
    cStats.addEventListener('characteristicvaluechanged',e=>onStats(e.target.value));
    cHist.addEventListener('characteristicvaluechanged',e=>onHist(e.target.value));
    await cStats.startNotifications();
    await cFix.startNotifications();
    histBuf=[];
    await cHist.startNotifications();                  // 구독 즉시 ESP가 이력을 재생
    bleOn=true;$('ble').textContent='BLE 연결됨';$('ble').classList.add('on');
    if(es){es.close();es=null;}
    $('st').innerHTML='<b class="ok">BLE</b> 연결됨 · 데이터 대기';
    keepAwake();
  }catch(err){bleOn=false;$('ble').textContent='BLE 연결';$('ble').classList.remove('on');$('st').innerHTML=bleErrorHtml(err);}
}
// 브라우저가 Web Bluetooth를 막아둔 경우(인앱 브라우저·웨일·Brave·Edge·Opera 등) 안내 + Chrome으로 여는 인텐트 링크
function chromeIntent(){return 'intent://'+location.host+location.pathname+location.search+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';}
function bleErrorHtml(err){
  const m=(err&&err.message)||String(err);
  if(/globally disabled|not supported|NotSupported/i.test(m))
    return '<b class="bad">● 이 브라우저는 Web Bluetooth를 막아둠</b> (카톡·네이버 인앱, 웨일, Brave, Edge 등)<br>'
      +'<a href="'+chromeIntent()+'" style="color:#8ab4ff;font-weight:600">▶ Chrome으로 열기</a> 또는 주소를 복사해 Chrome에 붙여넣기';
  if(/User cancelled|cancelled/i.test(m)) return '<b class="warn">● 기기 선택 취소됨</b> 다시 BLE 연결을 누르세요';
  if(/adapter|Bluetooth.*(off|unavailable)/i.test(m)) return '<b class="bad">● 블루투스가 꺼져 있음</b> 폰 블루투스를 켜고 다시 시도';
  return '<b class="bad">● BLE 실패</b> '+m;
}
function onFix(v){
  if(v.byteLength<20)return;
  const fl=v.getUint8(0);
  update({fix:fl&1?1:0,gps:fl&2?1:0,imu:fl&4?1:0,pt:fl&8?1:0,
    sat:v.getUint8(1),hdop:v.getUint8(2)/10,siv:v.getUint8(3)>>3,
    lat:v.getInt32(4,true)/1e7,lon:v.getInt32(8,true)/1e7,
    spd:v.getUint16(12,true)*0.036,crs:v.getUint16(14,true)/10,dist:v.getUint32(16,true)/100,
    max:stats.max,el:stats.el,z:stats.z,spr:stats.spr,pl:stats.pl,n:stats.n,alt:stats.alt});
}
function onStats(v){
  if(v.byteLength<20)return;
  stats={max:v.getUint16(0,true)/10,el:v.getUint16(2,true),z:[0,1,2,3,4].map(i=>v.getUint16(4+i*2,true)),
    spr:v.getUint16(14,true),pl:v.getUint16(16,true)/10,n:v.getUint16(18,true),alt:v.byteLength>=22?v.getInt16(20,true):null};
}
function onHist(v){
  for(let o=0;o+8<=v.byteLength;o+=8){
    const a=v.getInt32(o,true);
    if(a===0x7fffffff){setPts(histBuf);histBuf=[];return;}
    histBuf.push([a/1e7,v.getInt32(o+4,true)/1e7]);
  }
}
function gpxText(){
  return '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="FootTrack" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>FootTrack</name><trkseg>\n'
    +pts.map(p=>'<trkpt lat="'+p[0].toFixed(7)+'" lon="'+p[1].toFixed(7)+'"></trkpt>').join('\n')+'\n</trkseg></trk></gpx>\n';
}

/* ---- 시작 ---- */
initMap();
if(hasBle){$('ble').hidden=false;$('ble').onclick=bleConnect;}
if(viaHttp){loadTrack().catch(()=>{}).then(connectSse);}
else{$('st').innerHTML=hasBle?'<b class="warn">BLE 연결</b> 버튼을 눌러 FootTrack에 연결하세요'
  :'<b class="bad">이 브라우저는 Web Bluetooth 미지원</b> <a href="'+chromeIntent()+'" style="color:#8ab4ff;font-weight:600">▶ Chrome으로 열기</a>';}
$('follow').onclick=()=>setFollow(!follow);
$('reset').onclick=()=>{
  if(!confirm('기록을 초기화할까요?'))return;
  const done=()=>{setPts([]);centered=false;last=null;};
  if(bleOn)bleCtrl.writeValue(Uint8Array.of(1)).then(done);else fetch('/reset',{method:'POST'}).then(done);
};
$('gpx').onclick=e=>{
  if(!bleOn&&viaHttp)return;                          // ESP 서버가 GPX 생성
  e.preventDefault();
  const b=new Blob([gpxText()],{type:'application/gpx+xml'}),u=URL.createObjectURL(b),a=document.createElement('a');
